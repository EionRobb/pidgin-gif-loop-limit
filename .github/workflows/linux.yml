name: Linux
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libgtk2.0-dev gettext
          # We only need these to build, not to run.  Skip the dependency check.
          sudo apt download libpurple0t64 libpurple-dev pidgin-dev
          sudo dpkg --force-depends -i libpurple0*.deb libpurple-dev*.deb pidgin-dev*.deb
      
      - name: make
        run: make gif_loop_limit.so

      - name: archive
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with: 
            name: plugin-linux
            path: gif_loop_limit.so

      - name: Set date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && !env.ACT
        uses: ncipollo/release-action@v1
        with:
          artifacts: gif_loop_limit.so
          tag: daily-${{ steps.date.outputs.DATE }}
          name: Daily ${{ steps.date.outputs.DATE }}
          allowUpdates: true
          makeLatest: true

      - name: attest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && !env.ACT
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: gif_loop_limit.so
